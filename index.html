<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Evil Manul - Anti-Tamagotchi</title>

    <!-- Telegram WebApp SDK -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        body {

            background-color: #121212;

            color: #ffffff;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            text-align: center;

            padding: 15px;

            margin: 0;

            user-select: none;

            -webkit-user-select: none;

        }

        .container {

            max-width: 400px;

            margin: 0 auto;

        }

        .manul-img {

            width: 220px;

            height: 220px;

            border-radius: 24px;

            object-fit: cover;

            border: 3px solid #ff4757;

            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);

            transition: transform 0.1s ease;

        }

        .manul-img:active {

            transform: scale(0.96) rotate(-2deg);

        }

        .stats {

            background: #1e1e1e;

            padding: 12px;

            border-radius: 14px;

            margin: 12px 0;

            border: 1px solid #333;

            font-size: 14px;

        }

        .score-num {

            font-size: 20px;

            font-weight: bold;

            color: #ff4757;

        }

        .energy-bar-container {

            background: #333;

            border-radius: 10px;

            height: 12px;

            width: 100%;

            margin-top: 8px;

            overflow: hidden;

            border: 1px solid #444;

        }

        .energy-bar {

            background: linear-gradient(90deg, #ff4757, #ffa502);

            height: 100%;

            width: 100%;

            transition: width 0.2s ease;

        }

        .actions-grid {

            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-top: 15px;

        }

        .btn-mess {

            background: linear-gradient(135deg, #ff4757, #ff6b81);

            color: white;

            border: none;

            padding: 12px 15px;

            font-size: 15px;

            border-radius: 12px;

            cursor: pointer;

            font-weight: bold;

            width: 100%;

            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);

            transition: transform 0.08s ease, opacity 0.2s;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }

        .btn-mess:active {

            transform: scale(0.97);

        }

        .btn-mess:disabled {

            background: #444;

            color: #777;

            box-shadow: none;

            cursor: not-allowed;

        }

        .dialogue {

            background: #252525;

            border-left: 4px solid #ff4757;

            padding: 12px;

            margin-top: 15px;

            border-radius: 0 12px 12px 0;

            text-align: left;

            font-style: italic;

            font-size: 14px;

            line-height: 1.4;

            min-height: 42px;

        }
