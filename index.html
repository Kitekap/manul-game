<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Evil Manul - Anti-Tamagotchi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
            user-select: none;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .manul-img {
            width: 220px;
            height: 220px;
            border-radius: 24px;
            object-fit: cover;
            border: 3px solid #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }
        .stats {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 14px;
            margin: 12px 0;
            border: 1px solid #333;
        }
        .score-num {
            font-size: 20px;
            font-weight: bold;
            color: #ff4757;
        }
        .energy-bar-container {
            background: #333;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
        }
        .energy-bar {
            background: linear-gradient(90deg, #ff4757, #ffa502);
            height: 100%;
            width: 100%;
        }
        .btn-mess {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dialogue {
            background: #252525;
            border-left: 4px solid #ff4757;
            padding: 12px;
            margin-top: 15px;
            border-radius: 0 12px 12px 0;
            text-align: left;
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Manul Dude 😾</h1>
        
        <img src="manul.jpg" alt="Manul Dude" class="manul-img">

        <div class="stats">
            <div>💥 Chaos: <span id="score" class="score-num">0</span></div>
            <div>⚡️ Energy: <span id="energyText">100</span>/100</div>
            <div class="energy-bar-container">
                <div class="energy-bar" id="energyBar"></div>
            </div>
        </div>

        <div>
            <button class="btn-mess" onclick="action(5, 10, 'Sup man, weak push!')">
                <span>☕️ Push Cup</span><span>-5⚡ | +10💥</span>
            </button>
            <button class="btn-mess" onclick="action(15, 35, 'Bro, sofa is ruined!')">
                <span>🛋 Scratch Sofa</span><span>-15⚡ | +35💥</span>
            </button>
            <button class="btn-mess" onclick="action(40, 100, 'Absolute vandalism!')">
                <span>🥾 Mess in Shoes</span><span>-40⚡ | +100💥</span>
            </button>
        </div>

        <div class="dialogue" id="msg">
            Manul: "Sup man? Ready to cause chaos, dude?"
        </div>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('score')) || 0;
        let energy = parseInt(localStorage.getItem('energy')) || 100;

        updateUI();

        function action(cost, reward, text) {
            if (energy < cost) {
                document.getElementById('msg').innerText = 'Manul: "Bro, I am out of energy! Let me sleep!"';
                return;
            }

            energy -= cost;
            score += reward;

            localStorage.setItem('score', score);
            localStorage.setItem('energy', energy);

            updateUI();
            document.getElementById('msg').innerText = 'Manul: "' + text + '"';
        }

        setInterval(function() {
            if (energy < 100) {
                energy += 1;
                localStorage.setItem('energy', energy);
                updateUI();
            }
        }, 2000);

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energyText').innerText = energy;
            document.getElementById('energyBar').style.width = energy + '%';
        }
    </script>
</body>
</html>
